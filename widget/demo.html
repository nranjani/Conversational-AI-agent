<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayStayTion Pet Resort – Chat Widget Demo</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fdf8f3; color: #2b2b2b; }
    header { background: #2b2b2b; color: #fff; padding: 18px 24px; font-weight: 600; }
    main { max-width: 720px; margin: 48px auto; padding: 0 16px; line-height: 1.6; }
    h1 { font-size: 32px; margin-bottom: 8px; }
    .note { background: #fff; border: 1px solid #eadfd3; border-radius: 12px; padding: 16px 20px; }
    code { background: #f2ece5; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <header>PlayStayTion Pet Resort</header>
  <main>
    <h1>Kennel-free boarding in Sadler, TX</h1>
    <p>This page stands in for the resort's website. The 🐾 button in the bottom-right corner is the chat widget.</p>
    <div class="note">
      To add it to any site, paste one line before <code>&lt;/body&gt;</code>:<br />
      <code>&lt;script src="https://YOUR-API.onrender.com/widget/widget.js" defer&gt;&lt;/script&gt;</code>
    </div>
  </main>
  <script src="/widget/widget.js" defer></script>
</body>
</html>
